[project]
name = "local-whisper"
version = "0.18.2"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.0",
    "sounddevice>=0.5.6",
    "numpy>=2.5.2",
    "pyperclip>=1.8",
    "pynput>=1.8.2",
    "openai>=3.3.1",
    "soundfile>=0.14.0",
]

[project.scripts]
local-whisper = "local_whisper.__main__:main"

[project.optional-dependencies]
parakeet = [
    "parakeet-mlx>=0.5.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.16.3", "pre-commit>=4.6.2"]

[tool.coverage.run]
source = ["local_whisper"]
# benchmark.py drives real models/timings; not exercised by the mocked suite.
omit = ["*/local_whisper/benchmark.py"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_whisper"]

# Automated versioning: releases are computed from Conventional Commits on
# push to master. Since PRs are squash-merged, the PR title becomes the
# commit message python-semantic-release parses — see CONTRIBUTING.md.
# Baseline: tag v0.12.0 anchors history before this automation existed;
# everything from here is bumped/tagged/changelogged automatically.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/local_whisper/__init__.py:__version__"]
# Baseline starts at 0.12.0 — permit a 0.x version as valid (PSR default
# refuses to treat a 0.x version as releasable without this).
allow_zero_version = true
# Stay in 0.x on a breaking change (minor bump) rather than jumping straight
# to 1.0.0 — matches the pre-1.0 behaviour documented in CONTRIBUTING.md.
major_on_zero = false
# The release pull request is merged as this non-releasable commit. Its merge
# triggers CI to create the corresponding tag and GitHub Release.
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.master]
match = "^master$"
