name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    # Tests are fully mocked (no real mic/GPU/Metal/Accessibility/network
    # calls) — see tests/conftest.py + test_transcribe.py/test_hotkey.py.
    # Two native pieces are still touched at *import* time though, so both
    # need a system-level stand-in even though nothing is actually driven:
    #  - sounddevice does a ctypes lookup for libportaudio at import.
    #  - pynput's xorg backend (used on any non-darwin/win32 platform)
    #    connects to a real X display while importing pynput._util.xorg.
    runs-on: ubuntu-latest
    strategy:
      # Compatibility matrix: report every interpreter's result, not just the
      # first failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # setup-uv installs the interpreter and pins it for every later uv call,
      # so uv sync/run need no --python flag of their own.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/validate_config.py

      - name: Format check
        run: uv run ruff format --check src/ tests/ scripts/validate_config.py

      # Only Test needs these (see comment above); installing after Lint/Format
      # check means a run that fails there doesn't pay this cost for nothing.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 xvfb

      - name: Test
        run: xvfb-run -a uv run pytest tests/ -v

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: master

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Publish merged release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)"
          expected="chore(release): ${version}"
          subject="$(git log -1 --format=%s)"
          # A squash merge appends " (#<PR number>)" to the PR title, so match
          # that optional suffix too instead of requiring an exact string equal.
          case "$subject" in
            "$expected" | "$expected"\ \(#[0-9]*\)) ;;
            *)
              echo "Not a release merge; preparing a release pull request."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        if: steps.publish.outputs.merged != 'true'
        id: prepare
        run: |
          version="$(uvx --from python-semantic-release==10.6.1 semantic-release version --print)"
          if [ -z "$version" ]; then
            echo "No releasable commits found."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uvx --from python-semantic-release==10.6.1 semantic-release version \
            --no-commit --no-tag --no-push --no-vcs-release
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open or update release pull request
        if: steps.prepare.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: release/next
          commit-message: "chore(release): ${{ steps.prepare.outputs.version }}"
          title: "chore(release): ${{ steps.prepare.outputs.version }}"
          body: |
            Generated release files for v${{ steps.prepare.outputs.version }}.

            Review and merge this pull request. After its merge to `master`, CI creates the matching tag and GitHub Release.
          add-paths: |
            pyproject.toml
            src/local_whisper/__init__.py
            CHANGELOG.md
