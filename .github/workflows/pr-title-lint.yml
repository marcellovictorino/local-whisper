name: PR title lint

# PRs are squash-merged, so the PR title becomes the commit message that
# python-semantic-release parses on master to compute the next version and
# changelog entry. A non-Conventional-Commits title means a silent
# no-release instead of a loud failure — so it's linted at PR time instead.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
